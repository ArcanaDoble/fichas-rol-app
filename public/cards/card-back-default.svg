<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 1050" role="img" aria-labelledby="title desc">
  <title id="title">Reverso elegante de carta</title>
  <desc id="desc">Reverso oscuro y sobrio con doble marco dorado y un sello geométrico central.</desc>
  <defs>
    <linearGradient id="field" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07090f"/>
      <stop offset="0.5" stop-color="#12151e"/>
      <stop offset="1" stop-color="#06070b"/>
    </linearGradient>
    <radialGradient id="light" cx="50%" cy="48%" r="68%">
      <stop offset="0" stop-color="#c8aa6e" stop-opacity=".1"/>
      <stop offset=".5" stop-color="#785a28" stop-opacity=".025"/>
      <stop offset="1" stop-color="#000" stop-opacity=".42"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#765523"/>
      <stop offset=".28" stop-color="#ead39a"/>
      <stop offset=".55" stop-color="#b58a45"/>
      <stop offset=".78" stop-color="#f0dca8"/>
      <stop offset="1" stop-color="#6b491c"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="9" result="blur"/>
      <feFlood flood-color="#000" flood-opacity=".65"/>
      <feComposite in2="blur" operator="in"/>
      <feOffset dy="7"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="cardClip">
      <rect x="12" y="12" width="726" height="1026" rx="34"/>
    </clipPath>
  </defs>

  <g clip-path="url(#cardClip)">
    <rect x="12" y="12" width="726" height="1026" rx="34" fill="url(#field)"/>
    <rect x="12" y="12" width="726" height="1026" rx="34" fill="url(#light)"/>

    <path d="M375 79v44M375 927v44" stroke="#c8aa6e" stroke-width="2" stroke-opacity=".55"/>
    <path d="m375 131 10 15-10 15-10-15Z" fill="#090b11" stroke="url(#gold)" stroke-width="2"/>
    <path d="m375 889 10 15-10 15-10-15Z" fill="#090b11" stroke="url(#gold)" stroke-width="2"/>

    <g transform="translate(375 525)" filter="url(#softShadow)">
      <circle r="105" fill="#080a10" stroke="#2e2517" stroke-width="10"/>
      <circle r="98" fill="#0d1018" stroke="url(#gold)" stroke-width="3"/>
      <circle r="78" fill="none" stroke="#c8aa6e" stroke-width="1.5" stroke-opacity=".32"/>

      <path d="M0-52 15-15 52 0 15 15 0 52-15 15-52 0-15-15Z"
            fill="none" stroke="url(#gold)" stroke-width="4" stroke-linejoin="round"/>
      <path d="M0-25 25 0 0 25-25 0Z" fill="#090b11" stroke="#d8bd7d" stroke-width="2"/>
      <circle r="6" fill="#d8bd7d"/>
    </g>

    <g fill="#c8aa6e" fill-opacity=".62">
      <circle cx="242" cy="525" r="2.5"/>
      <circle cx="508" cy="525" r="2.5"/>
    </g>
    <path d="M135 525h87M528 525h87" stroke="url(#gold)" stroke-width="2" stroke-linecap="round"/>
  </g>

  <rect x="14" y="14" width="722" height="1022" rx="32" fill="none" stroke="#020307" stroke-width="12"/>
  <rect x="31" y="31" width="688" height="988" rx="26" fill="none" stroke="url(#gold)" stroke-width="4"/>
  <rect x="46" y="46" width="658" height="958" rx="19" fill="none" stroke="#d8bd7d" stroke-width="1.5" stroke-opacity=".44"/>
  <rect x="58" y="58" width="634" height="934" rx="14" fill="none" stroke="#6f5329" stroke-width="1" stroke-opacity=".42"/>
</svg>
